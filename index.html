<style>
/* Layout: one-screen phone app; a single big tappable card is the hero of every game screen */
:root{

}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;

  background-attachment:fixed}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px;

h1{font-family:var(--display);font-weight:400;font-size:clamp(3rem,16vw,4.6rem);line-height:.9;margin:0;letter-spacing:.01em}
h1 span{color:var(--gold)}
h2{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0;text-wrap:balance}
.tag{color:var(--muted);margin:6px 0 0;font-size:1rem}
.label{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.langs{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--bg2);background:transparent;color:var(--fg);border-radius:999px;padding:8px 14px;font:700 .9rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border:0;border-radius:22px;padding:18px 14px 16px;text-align:left;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:118px;

.mode:hover,.mode:focus-visible{transform:rotate(0) scale(1.03)}

.mode small{font-size:.85rem;font-weight:500;opacity:.8}
.m-td{background:linear-gradient(135deg,var(--truth),var(--dare));--r:-1.5deg}
.m-nv{background:var(--never);--r:1.2deg}
.m-lk{background:var(--likely);--r:1deg}
.m-im{background:var(--imp);--r:-1deg;color:var(--fg)}
.box{background:var(--bg2);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px}

input[type=text]:focus{outline:2px solid var(--gold);outline-offset:1px}
.btn{border:0;border-radius:14px;padding:12px 16px;font:700 1rem var(--body);cursor:pointer;background:var(--fg);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid #4a3a74}
.btn.gold{background:var(--gold)}
.btn.big{width:100%;padding:16px;font-size:1.1rem}
.btn:focus-visible,.chip:focus-visible,.mode:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.players{display:flex;flex-wrap:wrap;gap:8px}
.pl{background:var(--bg);border-radius:999px;padding:6px 8px 6px 14px;display:flex;align-items:center;gap:6px;font-weight:500}
.pl button{background:#4a3a74;border:0;color:var(--fg);width:24px;height:24px;border-radius:50%;cursor:pointer;font-weight:700}
.lock{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lock p{margin:0;font-size:.9rem;color:var(--muted)}
.pill{font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--gold);color:var(--ink);white-space:nowrap}
.pill.off{background:#4a3a74;color:var(--fg)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.turn{font-size:1.05rem;color:var(--muted)}
.turn b{color:var(--fg)}
.card{flex:1;min-height:320px;border-radius:28px;padding:28px 24px;display:flex;flex-direction:column;justify-content:space-between;color:var(--ink);
  box-shadow:0 18px 40px -18px #000;animation:pop .28s ease-out}
.card .kind{font-family:var(--display);font-size:1rem;letter-spacing:.06em;text-transform:uppercase}
.card .txt{font-size:clamp(1.45rem,6.4vw,1.9rem);font-weight:700;line-height:1.25;text-wrap:balance}
.card .foot{font-size:.85rem;font-weight:500;opacity:.75;font-variant-numeric:tabular-nums}
.c-truth{background:var(--truth)} .c-dare{background:var(--dare)} .c-never{background:var(--never)} .c-likely{background:var(--likely)}
.c-spicy{background:linear-gradient(160deg,var(--imp),var(--likely));color:var(--fg)}
.c-imp{background:var(--imp);color:var(--fg)} .c-word{background:var(--fg)} .c-hide{background:var(--bg2);color:var(--fg);cursor:pointer}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice .btn{padding:22px 10px;font-family:var(--display);font-weight:400;font-size:1.2rem;border-radius:20px}
.b-truth{background:var(--truth)} .b-dare{background:var(--dare)}
.note{font-size:.85rem;color:var(--muted);margin:0}
.msg{font-size:.9rem;min-height:1.2em;margin:0}
.tools{display:flex;gap:8px;flex-wrap:wrap}
textarea{width:100%;box-sizing:border-box;min-height:110px;background:var(--bg);border:2px solid #4a3a74;color:var(--fg);border-radius:14px;padding:12px;font:500 1rem var(--body);resize:vertical}
textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.clist{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto}
.ci{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:.95rem;line-height:1.35}
.ci span{min-width:0;overflow-wrap:anywhere}
.ci.base{opacity:.6}
.ci button{flex:none;background:#4a3a74;border:0;color:var(--fg);border-radius:8px;padding:4px 10px;cursor:pointer;font-weight:700}
.chip .n{opacity:.65;font-weight:500;margin-left:4px;font-variant-numeric:tabular-nums}
.mode:disabled{opacity:.35;cursor:not-allowed}
details summary{cursor:pointer;color:var(--muted);font-weight:500}
/* TV: wider canvas, huge type, remote-friendly focus */
.tv .app{max-width:1100px;gap:24px}
.tv .card{min-height:56vh;padding:48px}
.tv .card .txt{font-size:clamp(2.2rem,4.6vw,4.2rem)}
.tv .card .kind{font-size:1.4rem}
.tv .btn.big,.tv .choice .btn{font-size:1.6rem;padding:22px}
.tv .modes{grid-template-columns:repeat(4,1fr)}
.tv .btn:focus,.tv .chip:focus,.tv .mode:focus,.tv .card:focus{outline:5px solid var(--gold);outline-offset:4px}
@keyframes pop{from{transform:scale(.94) rotate(-2deg);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card{animation:none}.mode{transform:none}}
</style>

const CODES=["RONDA26"]; // demo: real codes come from the payment provider
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S={lang:store.get("ronda.lang",(navigator.language||"es").slice(0,2)),players:store.get("ronda.players",["Heri","Ana","Marco"]),spicy:store.get("ronda.spicy",false),view:"home",mode:null,decks:{},msg:"",custom:[],isAdmin:false,db:null,tv:store.get("ronda.tv",false),adm:{lang:"es",deck:"truth"},amsg:""};
if(!T[S.lang])S.lang="es";
const t=k=>T[S.lang][k];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function pool(key){
  const d=D[S.lang],c=dk=>S.custom.filter(x=>x.lang===S.lang&&x.deck===dk).map(x=>x.text),m=(arr,sp)=>arr.map(txt=>({txt,spicy:sp}));
  if(key==="truth"||key==="dare"){const sk=key==="truth"?"sTruth":"sDare";return m(d[key].concat(c(key)),false).concat(S.spicy?m(d[sk].concat(c(sk)),true):[])}
  return m(d[key].concat(c(key)),false);
}
function draw(key){
  const p=pool(key),id=S.lang+key+S.spicy;
  if(!S.decks[id]||!S.decks[id].left.length)S.decks[id]={left:shuffle(p),n:0,total:p.length};
  const dk=S.decks[id];dk.n++;const c=dk.left.pop();
  return {txt:c.txt,spicy:c.spicy,n:dk.n,total:dk.total};
}
const app=document.getElementById("app");
function render(){
  document.documentElement.lang=S.lang;
  const v=S.view;let h="";
  if(v==="home"){
    h=`<header><h1>RON<span>DA</span></h1><p class="tag">${t("tag")}</p></header>
    <div class="langs" role="group" aria-label="${t("lang")}">${["es","de","it","en"].map(l=>`<button class="chip" data-lang="${l}" aria-pressed="${l===S.lang}">${l.toUpperCase()}</button>`).join("")}</div>
    <div class="tools"><button class="chip" data-act="tv" aria-pressed="${S.tv}">${t("tv")}</button>${S.isAdmin?`<button class="chip" data-act="admin">${t("panel")}</button>`:""}</div>
    <div class="label">${t("modes")}</div>
    <div class="modes">
      <button class="mode m-td" data-mode="td"><b>${t("td")}</b><small>${t("tdS")}</small></button>
      <button class="mode m-nv" data-mode="nv"><b>${t("nv")}</b><small>${t("nvS")}</small></button>
      <button class="mode m-lk" data-mode="lk"><b>${t("lk")}</b><small>${t("lkS")}</small></button>
      <button class="mode m-im" data-mode="im" ${S.tv?"disabled":""}><b>${t("im")}</b><small>${S.tv?t("imTv"):t("imS")}</small></button>
    </div>
    <section class="box">
      <div class="label">${t("players")} · ${S.players.length}</div>
      <div class="players">${S.players.map((p,i)=>`<span class="pl">${esc(p)}<button data-del="${i}" aria-label="×">×</button></span>`).join("")}</div>
      <form class="row" id="addf"><input type="text" id="pname" maxlength="16" placeholder="${t("ph")}" autocomplete="off"><button class="btn" type="submit">${t("add")}</button></form>
    </section>
    <section class="box">
      <div class="lock"><div><b>${t("spicy")}</b><p>${t("spicyS")}</p></div><span class="pill ${S.spicy?"":"off"}">${S.spicy?t("unlocked"):t("locked")}</span></div>
      ${S.spicy?"":`<form class="row" id="codef"><input type="text" id="code" placeholder="${t("code")}" autocomplete="off"><button class="btn gold" type="submit">${t("unlock")}</button></form><p class="note">${t("demo")}</p>`}
      <p class="msg" aria-live="polite">${S.msg}</p>
    </section>`;
  }
  else if(v==="game"){
    const g=S.game,m=S.mode;
    let top=`<div class="top"><button class="btn ghost" data-act="home">${t("back")}</button><span class="label">${t(m)}</span></div>`;
    if(m==="td"){
      const p=S.players[g.turn%S.players.length];
      if(!g.card){h=top+`<p class="turn">${t("turn")} <b>${esc(p)}</b></p><div class="card c-hide" style="justify-content:center"><div class="txt" style="text-align:center">${esc(p)}</div></div><div class="choice"><button class="btn b-truth" data-pick="truth" data-primary>${t("truth")}</button><button class="btn b-dare" data-pick="dare">${t("dare")}</button></div>`}
      else{const c=g.card;h=top+`<p class="turn">${t("turn")} <b>${esc(p)}</b></p><div class="card ${c.spicy?"c-spicy":"c-"+g.kind}"><div class="kind">${t(g.kind)}${c.spicy?" · 18+":""}</div><div class="txt">${esc(c.txt)}</div><div class="foot">${t("card")} ${c.n}/${c.total}</div></div><button class="btn big" data-act="tdnext" data-primary>${t("next")}</button>`}
    }
    else if(m==="nv"||m==="lk"){
      const c=g.card,k=m==="nv"?"never":"likely";
      h=top+`<div class="card c-${k}"><div class="kind">${t(m)}</div><div class="txt">${esc(c.txt)}</div><div class="foot">${t(m==="nv"?"nvHint":"lkHint")} · ${c.n}/${c.total}</div></div><button class="btn big" data-act="simple" data-primary>${t("next")}</button>`;
    }
    else if(m==="im"){
      const n=S.players.length;
      if(g.step<n){const p=S.players[g.step];
        if(!g.show)h=top+`<p class="turn">${t("pass")} <b>${esc(p)}</b></p><button class="card c-hide" data-act="show" data-primary style="border:0;text-align:left;font:inherit"><div class="kind">${g.step+1}/${n}</div><div class="txt">${t("tap")}</div><div class="foot">${esc(p)}</div></button>`;
        else{const imp=g.step===g.imp;h=top+`<p class="turn"><b>${esc(p)}</b></p><div class="card ${imp?"c-imp":"c-word"}"><div class="kind">${imp?t("youImp"):t("yourWord")}</div><div class="txt">${imp?"???":esc(g.word)}</div><div class="foot">${imp?t("impHint"):""}</div></div><button class="btn big" data-act="hide" data-primary>${t("hide")}</button>`}
      } else if(!g.revealed){
        h=top+`<div class="card c-likely"><div class="kind">${t("discuss")}</div><div class="txt">${t("starts")}: ${esc(S.players[g.first])}</div><div class="foot">${t("discussHint")}</div></div><button class="btn big gold" data-act="reveal" data-primary>${t("reveal")}</button>`;
      } else {
        h=top+`<div class="card c-imp"><div class="kind">${t("impWas")}</div><div class="txt">${esc(S.players[g.imp])}</div><div class="foot">${t("wordWas")}: ${esc(g.word)}</div></div><button class="btn big" data-act="imnew" data-primary>${t("again")}</button>`;
      }
    }
  }
  else if(v==="admin")h=renderAdmin();
  document.body.classList.toggle("tv",S.tv);
  app.innerHTML=h;
  if(S.tv){const f=app.querySelector("[data-primary]")||app.querySelector(".mode:not(:disabled)");f&&f.focus()}
}
const DECKS=[["truth","Verdad"],["dare","Reto"],["never","Yo nunca"],["likely","¿Quién es más probable?"],["sTruth","Verdad 18+"],["sDare","Reto 18+"],["words","Palabras Impostor"]];
function renderAdmin(){
  const a=S.adm,base=D[a.lang][a.deck],mine=S.custom.filter(x=>x.lang===a.lang&&x.deck===a.deck).sort((x,y)=>(y.ts||0)-(x.ts||0));
  const cnt=dk=>D[a.lang][dk].length+S.custom.filter(x=>x.lang===a.lang&&x.deck===dk).length;
  return `<div class="top"><button class="btn ghost" data-act="home">${t("back")}</button><span class="label">Panel</span></div>
  <h2>Panel de cartas</h2>
  <div class="langs" role="group" aria-label="Idioma">${["es","de","it","en"].map(l=>`<button class="chip" data-alang="${l}" aria-pressed="${l===a.lang}">${l.toUpperCase()}</button>`).join("")}</div>
  <div class="langs" role="group" aria-label="Tema">${DECKS.map(([k,n])=>`<button class="chip" data-adeck="${k}" aria-pressed="${k===a.deck}">${n}<span class="n">${cnt(k)}</span></button>`).join("")}</div>
  <form class="box" id="cardf"><label class="label" for="newcards">Nuevas cartas · una por línea</label>
    <textarea id="newcards" maxlength="4000" placeholder="${a.deck==="words"?"Ej.: Carnaval":"Ej.: ¿Cuál es tu mayor secreto?"}"></textarea>
    <button class="btn gold big" type="submit">Añadir a ${DECKS.find(d=>d[0]===a.deck)[1]} (${a.lang.toUpperCase()})</button>
    <p class="msg" aria-live="polite">${esc(S.amsg)}</p></form>
  <section class="box"><div class="label">Tus cartas · ${mine.length}</div>
    <div class="clist">${mine.length?mine.map(x=>`<div class="ci"><span>${esc(x.text)}</span><button data-cdel="${x.id}" aria-label="Borrar">Borrar</button></div>`).join(""):`<p class="note">Todavía no has añadido cartas en este tema. Escribe arriba, una por línea.</p>`}</div>
    <details><summary>Incluidas de serie · ${base.length}</summary><div class="clist" style="margin-top:8px">${base.map(x=>`<div class="ci base"><span>${esc(x)}</span></div>`).join("")}</div></details>
    <p class="note">Todas las cartas salen siempre en orden aleatorio y no se repiten hasta acabar el mazo.</p></section>`;
}
function startMode(m){
  if(m!=="nv"&&m!=="lk"&&S.players.length<3){S.msg=t("min");render();return}
  S.mode=m;S.msg="";S.view="game";
  if(m==="td")S.game={turn:0,card:null};
  if(m==="nv")S.game={card:draw("never")};
  if(m==="lk")S.game={card:draw("likely")};
  if(m==="im")newImp();
  render();window.scrollTo(0,0);
}
function newImp(){const w=D[S.lang].words,n=S.players.length;S.game={step:0,show:false,imp:Math.random()*n|0,first:Math.random()*n|0,word:w[Math.random()*w.length|0],revealed:false}}
app.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.lang){S.lang=b.dataset.lang;store.set("ronda.lang",S.lang);S.msg="";render();return}
  if(b.dataset.mode){startMode(b.dataset.mode);return}
  if(b.dataset.del){S.players.splice(+b.dataset.del,1);store.set("ronda.players",S.players);render();return}
  if(b.dataset.pick){S.game.kind=b.dataset.pick;S.game.card=draw(b.dataset.pick);render();return}
  if(b.dataset.alang){S.adm.lang=b.dataset.alang;S.amsg="";render();return}
  if(b.dataset.adeck){S.adm.deck=b.dataset.adeck;S.amsg="";render();return}
  if(b.dataset.cdel){S.db&&S.db.doc("cards/"+b.dataset.cdel).delete().catch(()=>{S.amsg="No se pudo borrar. Inténtalo de nuevo.";render()});return}
  const a=b.dataset.act,g=S.game;
  if(a==="tv"){S.tv=!S.tv;store.set("ronda.tv",S.tv);render();return}
  if(a==="admin"){S.view="admin";S.adm.lang=S.lang;render();return}
  if(a==="home"){S.view="home";render()}
  if(a==="tdnext"){g.turn++;g.card=null;render()}
  if(a==="simple"){g.card=draw(S.mode==="nv"?"never":"likely");render()}
  if(a==="show"){g.show=true;render()}
  if(a==="hide"){g.show=false;g.step++;render()}
  if(a==="reveal"){g.revealed=true;render()}
  if(a==="imnew"){newImp();render()}
});
app.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="addf"){const i=document.getElementById("pname"),v=i.value.trim();if(v&&S.players.length<12){S.players.push(v);store.set("ronda.players",S.players);S.msg=""}render();document.getElementById("pname").focus()}
  if(e.target.id==="cardf"){addCards();return}
  if(e.target.id==="codef"){const v=document.getElementById("code").value.trim().toUpperCase();if(CODES.includes(v)){S.spicy=true;store.set("ronda.spicy",true);S.decks={};S.msg=t("ok")}else S.msg=t("bad");render()}
});
async function addCards(){
  const ta=document.getElementById("newcards"),lines=ta.value.split("\n").map(x=>x.trim()).filter(Boolean).map(x=>x.slice(0,240));
  if(!lines.length||!S.db)return;
  const {lang,deck}=S.adm;let ok=0;
  for(const text of lines){try{await S.db.collection("cards").add({lang,deck,text,ts:Date.now()});ok++}catch(e){S.amsg=e&&e.code==="quota_exceeded"?"Límite de cartas alcanzado.":"Algunas cartas no se guardaron. Inténtalo de nuevo.";break}}
  if(ok)S.amsg=ok+(ok===1?" carta añadida":" cartas añadidas");
  render();
}
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea"))return;
  const bs=[...app.querySelectorAll("button:not(:disabled)")],i=bs.indexOf(document.activeElement);
  if(e.key==="ArrowRight"||e.key==="ArrowDown"){bs[(i+1)%bs.length]?.focus();e.preventDefault()}
  else if(e.key==="ArrowLeft"||e.key==="ArrowUp"){bs[(i-1+bs.length)%bs.length]?.focus();e.preventDefault()}
  else if((e.key==="Escape"||e.key==="Backspace"||e.key==="GoBack"||e.key==="BrowserBack")&&S.view!=="home"){S.view="home";render();e.preventDefault()}
});
render();
(async()=>{
  if(!window.claude||!claude.use)return;
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(user){try{S.isAdmin=!!(await user.canEdit())}catch(e){}}
    if(!db){if(S.view==="home")render();return}
    S.db=db;
    db.collection("cards").onSnapshot(snap=>{
      S.custom=snap.docs.map(d=>Object.assign({id:d.id},d.data())).filter(x=>x.text&&D[x.lang]&&D[x.lang][x.deck]);
      S.decks={};
      if(S.view==="admin"){const ta=document.getElementById("newcards"),keep=ta?ta.value:"";render();const nt=document.getElementById("newcards");if(nt&&keep)nt.value=keep}
      else if(S.view==="home")render();
    },()=>{});
    if(S.view==="home")render();
  }catch(e){}
})();
